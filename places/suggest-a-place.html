<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suggest a Place - IG Worthy Spots</title>
  <style>
    :root {
      --coffee-dark: #3b2419;
      --coffee-medium: #6f4e37;
      --coffee-light: #a9744f;
      --cream: #faf3eb;
      --cream-card: #fffaf3;
      --accent: #c47a3d;
      --text-muted: #6b5d54;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--cream);
      color: var(--coffee-dark);
      line-height: 1.6;
    }

    header {
      background-color: var(--coffee-dark);
      color: var(--cream);
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
    }

    header h1 {
      margin: 0 0 0.25rem;
      font-size: 2rem;
      letter-spacing: 0.5px;
    }

    header p {
      margin: 0 0 1.25rem;
      color: #e6d5c3;
      font-style: italic;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin: 0;
      padding: 0;
    }

    nav a {
      color: var(--cream);
      text-decoration: none;
      font-weight: 600;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s ease;
    }

    nav a:hover,
    nav a:focus {
      border-bottom-color: var(--accent);
    }

    main {
      max-width: 640px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }

    main h2 {
      color: var(--coffee-medium);
      border-bottom: 2px solid #e6d5c3;
      padding-bottom: 0.5rem;
      text-align: center;
    }

    main > p {
      color: var(--text-muted);
      text-align: center;
    }

    form.suggest-form {
      background-color: var(--cream-card);
      border: 1px solid #eadfd2;
      border-radius: 12px;
      padding: 1.75rem;
      margin-top: 1.5rem;
      box-shadow: 0 4px 14px rgba(59, 36, 25, 0.08);
    }

    form.suggest-form fieldset {
      border: 1px solid #eadfd2;
      border-radius: 8px;
      padding: 1rem 1.25rem 1.25rem;
      margin: 0 0 1.5rem;
    }

    form.suggest-form legend {
      font-weight: 700;
      font-size: 1rem;
      color: var(--coffee-medium);
      padding: 0 0.5rem;
    }

    form.suggest-form label {
      display: block;
      font-weight: 600;
      margin-top: 1rem;
      margin-bottom: 0.35rem;
      color: var(--coffee-dark);
    }

    form.suggest-form fieldset label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
      margin-top: 0.6rem;
    }

    form.suggest-form input[type="text"],
    form.suggest-form input[type="email"] {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid #d9c8b8;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      background-color: #fff;
      color: var(--coffee-dark);
    }

    form.suggest-form input[type="text"]:focus,
    form.suggest-form input[type="email"]:focus {
      outline: 3px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    form.suggest-form input[type="radio"],
    form.suggest-form input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--coffee-light);
    }

    form.suggest-form button[type="submit"] {
      margin-top: 0.5rem;
      background-color: var(--coffee-medium);
      color: var(--cream);
      border: none;
      padding: 0.75rem 1.75rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    form.suggest-form button[type="submit"]:hover {
      background-color: var(--coffee-dark);
    }

    form.suggest-form button[type="submit"]:focus {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-top: 1px solid #eadfd2;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>IG Worthy Spots</h1>
    <p>A guide to the most photogenic places to visit, from hidden corners to iconic backdrops.</p>

    <nav>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="../about.html">About</a></li>
        <li><a href="../contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Suggest a Place</h2>
    <p>Know a photogenic spot I should check out? Tell me about it.</p>

    <form class="suggest-form">
      <label for="place-name">Place name</label>
      <input type="text" id="place-name" name="place-name" required>

      <fieldset>
        <legend>Category</legend>

        <label for="category-food">
          <input type="radio" id="category-food" name="category" value="food" checked>
          Food
        </label>

        <label for="category-study">
          <input type="radio" id="category-study" name="category" value="study-spot">
          Study spot
        </label>

        <label for="category-outdoors">
          <input type="radio" id="category-outdoors" name="category" value="outdoors">
          Outdoors
        </label>
      </fieldset>

      <fieldset>
        <legend>What's good about it</legend>

        <label for="good-affordable">
          <input type="checkbox" id="good-affordable" name="good-points" value="affordable">
          Affordable
        </label>

        <label for="good-wifi">
          <input type="checkbox" id="good-wifi" name="good-points" value="good-wifi">
          Good wifi
        </label>

        <label for="good-quiet">
          <input type="checkbox" id="good-quiet" name="good-points" value="quiet">
          Quiet
        </label>
      </fieldset>

      <label for="suggest-email">Contact email</label>
      <input type="email" id="suggest-email" name="suggest-email" required>

      <button type="submit">Send suggestion</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 IG Worthy Spots. All rights reserved.</p>
  </footer>

</body>
</html>
